<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

  /* ============================================================
     All photos are embedded directly in this file as base64 data,
     so it works as a single standalone HTML file — no separate
     images folder needed. Edit PROFILE and POSTS in the <script>
     section near the bottom to change text or swap photos.
     ============================================================ */

  :root{
    --bg:        #f6f8fa;
    --bg-soft:   #ffffff;
    --card:      #ffffff;
    --ink:       #14171a;
    --ink-dim:   #6b7580;
    --gold:      #1d9bf0;
    --moss:      #0d7fd1;
    --line:      rgba(20,23,26,0.08);
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  ::selection{ background: var(--gold); color: #171a15; }

  a{ color: inherit; }

  .wrap{
    max-width: 560px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--bg);
    position: relative;
  }

  /* ---------- Header / cover ---------- */

  .cover{
    height: 168px;
  background-image: url("./media/cover.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  position: relative;
  overflow: hidden;
  border-bottom: 1px solid var(--line);
  }
  .cover::after{
    content:"";
    position:absolute; inset:0;
    background-image: repeating-linear-gradient(
      100deg,
      transparent 0 18px,
      rgba(29,155,240,0.03) 18px 19px
    );
    opacity:.6;
  }

  .cover-overlay{
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 14px 18px 34px;
    background: linear-gradient(to bottom, rgba(10,14,20,0.55) 0%, rgba(10,14,20,0.15) 60%, transparent 100%);
    display:flex;
    flex-direction: column;
    gap: 10px;
    z-index: 1;
  }

  .cover-top-row{
    display:flex;
    align-items:center;
    gap: 8px;
  }

  .cover-name{
    color: #ffffff;
    font-family:'Fraunces', serif;
    font-weight: 600;
    font-size: 17px;
  }

  .cover-verified{
    width: 15px; height: 15px;
    flex-shrink: 0;
  }

  .cover-stats{
    display:flex;
    gap: 16px;
  }

  .cover-stat{
    display:flex;
    align-items:center;
    gap: 5px;
    color: rgba(255,255,255,0.92);
    font-family:'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
  }

  .cover-stat svg{
    width: 14px; height: 14px;
    opacity: .9;
  }

  .header{
    padding: 0 28px 20px;
    position: relative;
  }

  .avatar-row{
    display:flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-top: -56px;
  }

  .avatar{
    width: 112px; height: 112px;
    border-radius: 50%;
    border: 4px solid #ffffff;
    box-shadow: 0 2px 10px rgba(20,23,26,0.15);
    object-fit: cover;
    background: var(--card);
    display:block;
  }

  .edit-note{
    font-family:'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--ink-dim);
    letter-spacing: .02em;
    padding: 10px 4px 0;
    opacity: .55;
  }

  .name-row{
    display:flex;
    align-items:center;
    gap: 6px;
    margin: 16px 0 2px;
  }

  .name{
    font-family:'Fraunces', serif;
    font-weight: 600;
    font-size: 24px;
    letter-spacing: -0.01em;
  }

  .verified{
    width: 18px; height: 18px;
    flex-shrink: 0;
  }

  .subline{
    display:flex;
    align-items:center;
    gap: 6px;
    color: var(--ink-dim);
    font-family:'JetBrains Mono', monospace;
    font-size: 12.5px;
    margin-bottom: 14px;
  }
  .subline .dot{ opacity:.5; }

  .bio-title{
    font-weight: 600;
    font-size: 14px;
    letter-spacing: .01em;
    margin-bottom: 6px;
  }

  .bio{
    color: var(--ink-dim);
    font-size: 14.5px;
    line-height: 1.6;
    max-width: 46ch;
  }

  .bio .peak{
    display:block;
    margin-top: 6px;
    color: var(--ink);
  }

  .bio-extra{
    max-height: 0;
    overflow: hidden;
    transition: max-height .35s ease;
    white-space: pre-line;
  }
  .bio-extra.open{ max-height: 400px; }
  .bio-extra p{
    margin: 10px 0 0;
    color: var(--ink-dim);
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-line;
  }

  .more-info{
    background:none;
    border:none;
    color: var(--gold);
    font-family:'Inter',sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    padding: 8px 0 0;
    cursor:pointer;
  }

  .stats{
    display:flex;
    gap: 26px;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }

  .stat{ display:flex; flex-direction:column; gap:2px; }
  .stat b{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size: 17px;
  }
  .stat span{
    font-size: 11px;
    color: var(--ink-dim);
    text-transform: uppercase;
    letter-spacing: .08em;
  }


  /* ---------- Tabs ---------- */

  .tabs{
    display:flex;
    border-bottom: 1px solid var(--line);
    margin-top: 8px;
  }
  .tab{
    flex:1;
    text-align:center;
    padding: 14px 0 12px;
    font-family:'JetBrains Mono', monospace;
    font-size: 11.5px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-dim);
    border-bottom: 2px solid transparent;
    cursor: pointer;
  }
  .tab.active{
    color: var(--ink);
    border-bottom-color: var(--gold);
  }

  /* ---------- Posts grid ---------- */

  .grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
    padding: 0 3px;
  }

  .post{
    aspect-ratio: 1/1;
    overflow:hidden;
    background: var(--card);
    position: relative;
  }
  .post img{
    width:100%; height:100%;
    object-fit: cover;
    display:block;
    transition: transform .5s ease;
  }
  .post:hover img{ transform: scale(1.04); }

  .post.placeholder{
    display:flex;
    align-items:center;
    justify-content:center;
    color: var(--ink-dim);
    font-family:'JetBrains Mono', monospace;
    font-size: 10px;
    text-align:center;
    padding: 8px;
    line-height:1.5;
    border: 1px dashed var(--line);
  }

  /* ---------- Teaser row / fade out ---------- */

  .teaser-wrap{
    position: relative;
    margin-top: 3px;
    overflow: hidden;
  }

  .teaser-cover{
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(255,255,255,0) 0%,
      rgba(255,255,255,1) 50%,
      rgba(255,255,255,1) 100%
    );
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding-bottom: 14%;
  }

  .end-card{
    text-align: center;
    animation: floatIn .6s ease both;
  }

  .lock-icon{
    width: 30px; height: 30px;
    color: var(--ink-dim);
    margin: 0 auto 10px;
    display:block;
    animation: pulseLock 2.4s ease-in-out infinite;
  }

  .end-card .follow-text{
    color: var(--ink-dim);
    font-family:'Inter', sans-serif;
    font-weight: 600;
    font-size: 16px;
    margin: 0;
  }

  @keyframes floatIn{
    from{ opacity: 0; transform: translateY(10px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  @keyframes pulseLock{
    0%, 100%{ transform: scale(1); opacity: .85; }
    50%{ transform: scale(1.12); opacity: 1; }
  }

  .follow-section{
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
  }

  .follow-label{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: .12em;
    color: var(--ink-dim);
    margin-bottom: 10px;
  }

  .follow-btn-main{
    width: 100%;
    display:flex;
    align-items:center;
    justify-content: space-between;
    padding: 15px 22px;
    background: var(--gold);
    color: #ffffff;
    border: none;
    border-radius: 999px;
    font-family:'Inter', sans-serif;
    font-size: 14.5px;
    font-weight: 700;
    letter-spacing: .02em;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(29,155,240,0.3);
  }

  .follow-btn-main span{
    font-weight: 500;
    opacity: .9;
  }

  /* ---------- Follow modal ---------- */

  .modal-overlay{
    position: fixed;
    inset: 0;
    background: rgba(10,14,20,0.85);
    display:none;
    align-items:center;
    justify-content:center;
    z-index: 999;
    padding: 20px;
    animation: fadeIn .2s ease;
  }
  .modal-overlay.open{ display:flex; }

  @keyframes fadeIn{
    from{ opacity: 0; }
    to{ opacity: 1; }
  }

  .modal-box{
    width: 100%;
    max-width: 420px;
    background: #000;
    border-radius: 16px;
    overflow:hidden;
    position: relative;
    animation: popIn .28s cubic-bezier(.2,.9,.3,1.3);
  }

  @keyframes popIn{
    from{ opacity: 0; transform: scale(.85); }
    to{ opacity: 1; transform: scale(1); }
  }

  .modal-close{
    position:absolute;
    top: 10px; right: 10px;
    width: 30px; height: 30px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    color: #fff;
    border:none;
    font-size: 16px;
    cursor:pointer;
    z-index: 2;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .modal-box video{
    width: 100%;
    display:block;
    max-height: 80vh;
  }


</style>
</head>

  /* ============================================================
     No need to edit below this line
     ============================================================ */

  document.getElementById('nameField').textContent = PROFILE.name;
  document.getElementById('handleField').textContent = PROFILE.handle;
  document.getElementById('seenField').textContent = PROFILE.seen;
  document.getElementById('bioTitle').textContent = PROFILE.bioTitle;
  document.getElementById('peakField').textContent = PROFILE.peak;
  document.getElementById('bioExtraText').textContent = PROFILE.bioMore;
  document.getElementById('coverName').textContent = PROFILE.name;
  document.getElementById('coverFollowers').textContent = PROFILE.followers;
  document.getElementById('coverPhotos').textContent = PROFILE.photos;
  document.getElementById('coverVideos').textContent = PROFILE.videos;
  document.getElementById('coverLikes').textContent = PROFILE.likes;

  const moreBtn = document.getElementById('moreInfoBtn');
  const bioExtra = document.getElementById('bioExtra');
  moreBtn.addEventListener('click', () => {
    const isOpen = bioExtra.classList.toggle('open');
    moreBtn.textContent = isOpen ? 'Less info' : 'More info';
  });

  const grid = document.getElementById('postsGrid');
  const teaserGrid = document.getElementById('teaserGrid');

  function fillGrid(target, photos, placeholderText){
    if (photos.length === 0){
      for (let i = 0; i < 3; i++){
        const div = document.createElement('div');
        div.className = 'post placeholder';
        div.textContent = placeholderText;
        target.appendChild(div);
      }
    } else {
      photos.forEach(src => {
        const div = document.createElement('div');
        div.className = 'post';
        const img = document.createElement('img');
        img.src = src;
        img.alt = "post";
        div.appendChild(img);
        target.appendChild(div);
      });
    }
  }

  fillGrid(grid, POSTS, 'add photo to\nimages/ and list\nit in POSTS');

  // Teaser row repeats the first 3 photos again, faded out under the lock/follow prompt
  fillGrid(teaserGrid, POSTS.slice(0, 3), 'add photo to\nimages/ and list\nit in POSTS');

  /* ============================================================
     3) FOLLOW BUTTON — opens a popup that plays the video and
        the audio file at high volume. Both files must sit in a
        "media" folder next to this html file:
          media/video.mp4
          media/audio.mp3
     ============================================================ */

  const followBtn = document.getElementById('followBtn');
  const modalOverlay = document.getElementById('modalOverlay');
  const modalClose = document.getElementById('modalClose');
  const modalVideo = document.getElementById('modalVideo');
  const modalAudio = document.getElementById('modalAudio');

  followBtn.addEventListener('click', () => {
    modalOverlay.classList.add('open');
    modalVideo.currentTime = 0;
    modalAudio.currentTime = 0;
    modalAudio.volume = 1;
    modalVideo.volume = 1;
    modalVideo.play().catch(err => console.error("VIDEO ERROR:", err));
modalAudio.play().catch(err => console.error("AUDIO ERROR:", err));
  });

  function closeModal(){
    modalOverlay.classList.remove('open');
    modalVideo.pause();
    modalAudio.pause();
  }

  modalClose.addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) closeModal();
  });

</script>
